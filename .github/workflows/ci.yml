name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Read-only by default. release.yml calls this workflow, so the repository's own
# test code must never be able to inherit a write-capable token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Actions are pinned to full commit SHAs. A moving tag like @v4 lets the
      # action's code change under us, which matters most in a workflow that
      # runs alongside a write-capable job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'

      - name: Install runtime dependencies the shell helpers use
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Unit tests
        run: node tests/model.test.js

      - name: Manifest and repo hygiene
        run: node tests/manifest.test.js

      - name: Launcher / Model.js argv parity
        run: tests/launcher.test.sh

      # --severity=warning because SC2016 ("expressions don't expand in single
      # quotes") fires on every jq program in this repo, where `$var` is a jq
      # variable and single quotes are exactly right. Warnings and errors still
      # fail the build.
      - name: shellcheck
        run: shellcheck --severity=warning bin/omarchy-rdp-* bin/lib-*.sh dev-install.sh tests/launcher.test.sh

      - name: manifest.json is valid JSON
        run: jq -e . manifest.json > /dev/null
