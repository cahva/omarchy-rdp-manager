name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version manifest.json)
          if [ "$tag" != "$manifest" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, manifest.json says $manifest" >&2
            exit 1
          fi

      - name: Pull the release notes out of CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 == "## " v {f=1; next} f && /^## / {exit} f' \
            CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no '## $version' section" >&2
            exit 1
          fi
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
